name: Unit tests

# Project-owned. Unit tests and Coverage jobs stay in sync with the Unit tests
# and Coverage tables in docs/coding-conventions.md.
# Coverage runs only after Unit tests succeeds.
# With no steps (placeholders, or tables `None`), each job passes with a notice.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip}"
          curl -fsSL -o "$zip" "$url"
          unzip -q "$zip"
          install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import Godot project
        run: godot --headless --path game --import

      - name: GUT (Godot Unit Test)
        run: godot --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://test -gexit

  coverage:
    name: Coverage
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Coverage table in docs/coding-conventions.md is intentionally None until a
      # first-class GDScript CI coverage tool can fail under Threshold.
      - name: Not configured
        run: echo "::notice::No coverage commands configured; see docs/coding-conventions.md"
