name: Code lint

# Project-owned. Runs every lint and format command in the Tooling table of
# docs/coding-conventions.md, one step each; keep the two in sync.
# With no steps (placeholders, or Tooling `None`), the job passes with a notice.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin matches the Tooling table in docs/coding-conventions.md (ADR-0007).
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Format check
        run: gdformat --check game

      - name: Lint
        run: gdlint game

