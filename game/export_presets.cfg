; Debug APK for the android-debug branch. Gradle stays off: Godot signs the
; prebuilt template. The debug keystore is not stored here; export reads
; GODOT_ANDROID_KEYSTORE_DEBUG_PATH, _USER, and _PASSWORD.
; ADR-0008 / #506: include_filter packs the export script's
; res://release/asset_manifest.json copy so CMP-shell can resolve pictures.
; ADR-0009 / #504: the mobile orientation lock is not a preset key. The Android and
; iOS exporters derive android:screenOrientation and UISupportedInterfaceOrientations
; from display/window/handheld/orientation in game/project.godot, so both Android
; presets and the iOS preset inherit the locked portrait from that one setting and
; must not add an orientation override here.
; #544 / specs/view/projection.md A4: the OS status bar and the navigation /
; home-indicator band stay visible outside the game viewport, so this preset keeps
; screen/immersive_mode=false and screen/edge_to_edge=false. Do not flip either key.

