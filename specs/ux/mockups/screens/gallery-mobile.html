<!doctype html>
<!--
  OD mobile-app seed.

  A pixel-accurate iPhone 15 Pro frame (390 × 844) with Dynamic Island,
  status-bar SVG icons, and home indicator — drawn entirely in HTML/SVG, no
  external image. The screen content lives inside `<main class="screen">`;
  paste in one of the layouts from `references/layouts.md`.

  Tokens at the top of `<style>` mirror the web-prototype seed so a single
  DESIGN.md flows into both. Mobile spacing is tighter (~25%) and type sizes
  drop one step from desktop — all pre-applied here.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery · mobile · SimpleNono</title>
  <style>
    :root {
      --bg:      #F4F7F8;
      --surface: #F4F7F8;
      --fg:      #1B2833;
      --muted:   #6E7F8C;
      --border:  #C5D0D6;
      --accent:  #1B2833;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

      /* mobile type — one step down from web-prototype defaults */
      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 0;
      --radius-pill: 0;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    /* ─── caption above the device ──────────────────────────────────── */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    /* ─── device frame ──────────────────────────────────────────────── */
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background:
        linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    /* metallic side rails */
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    /* hardware buttons (subtle) */
    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }   /* silent */
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }   /* vol+ */
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }   /* vol- */
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; } /* power */

    /* ─── screen surface ────────────────────────────────────────────── */
    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Status bar — 47px to clear the island. SF-style time, signal/wifi/battery SVG. */
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    /* Content region — owns its scroll, frame stays still */
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Home indicator (must always be the last visible thing) */
    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    /* ─── screen primitives — used by layouts.md ────────────────────── */
    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 16px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grid-2  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
    }
    .header .icon-btn {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
    }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
    }
    .card.accent {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .card.accent .meta { color: rgba(255,255,255,0.72); }
    .card.flat { background: transparent; border: 0; padding: 12px 0; border-top: 1px solid var(--border); border-radius: 0; }
    .card.flat:first-child { border-top: 0; padding-top: 0; }

    /* list row */
    .list-row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .list-row:first-child { border-top: 0; }
    .list-row .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
    }
    .list-row .body .title { font-size: 15px; font-weight: 500; line-height: 1.25; }
    .list-row .body .sub   { color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 2px; }

    /* tab bar */
    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--tabs, 4), 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }

    /* primary button — full-width, 48px tap target */
    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
    }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
    }

    /* image placeholder */
    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      aspect-ratio: 4 / 3;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .ph-img.square { aspect-ratio: 1 / 1; }
    .ph-img.wide   { aspect-ratio: 16 / 9; }

    /* pill / tag */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .tag {
      display: inline-flex;
      padding: 3px 9px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
    }

    /* progress */
    .progress { height: 6px; background: rgba(255,255,255,0.25); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: #fff; }

    /* gallery + UX state coverage */
    nav.ux-states { display:flex; gap:12px; margin-top:8px; font-size:13px; }
    nav.ux-states a { color: var(--fg); text-decoration: underline; }
    .states > section { display: none; position: relative; min-height: 100%; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    .content { position: relative; }
    .progress-block { margin: 0 20px 14px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-card); }
    .progress-block .label { margin: 0 0 8px; font-size: 13px; }
    .progress-track { height: 8px; background: color-mix(in oklch, var(--border) 65%, var(--bg)); border: 1px solid var(--border); overflow: hidden; }
    .progress-track > span { display:block; height:100%; width:18.5%; background: var(--fg); }
    .puzzle-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding: 0 20px 24px; }
    .puzzle-tile { border:1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); display:flex; flex-direction:column; height:100%; }
    .puzzle-tile .open { border:0; background:transparent; color:inherit; font:inherit; padding:0; text-align:left; cursor:pointer; min-height:44px; width:100%; display:flex; flex-direction:column; flex:1 1 auto; }
    .puzzle-tile .thumb { aspect-ratio:1; border-bottom:1px solid var(--border); display:grid; place-items:center; font-family:var(--font-mono); font-size:10px; color:var(--muted);
      background: linear-gradient(135deg, var(--fg-soft), var(--accent-soft)), var(--surface); }
    
    .puzzle-tile .thumb.placeholder {
      background: #F4F7F8;
      padding: 0;
      overflow: hidden;
    }
    .puzzle-tile .thumb.placeholder .generic-puzzle {
      width: 100%;
      height: 100%;
      display: block;
    }

    .puzzle-tile .thumb.stored { background: #F4F7F8; padding: 0; overflow: hidden; }
    .puzzle-tile .thumb.stored svg { display: block; width: 100%; height: 100%; }
    .puzzle-tile .meta { padding:8px; display:flex; flex-direction:column; gap:3px; }
    .puzzle-tile .title { font-size:13px; font-weight:600; }
    .puzzle-tile .sub { font-size:11px; color:var(--muted); font-family:var(--font-mono); min-height: 2.6em; }
    .puzzle-tile .reset {
      align-self: flex-end;
      margin: auto 8px 8px;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .header .settings-btn { min-height:44px; min-width:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); color:var(--fg); font:inherit; font-size:13px; }
    .confirm-overlay { position:absolute; inset:0; z-index:4; background: color-mix(in oklch, var(--fg) 35%, transparent); display:grid; place-items:end center; padding:16px; }
    .confirm-sheet { width:100%; background:var(--bg); border:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:12px; }
    .confirm-sheet p { margin:0; font-size:15px; }
    .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .confirm-actions button { min-height:48px; border-radius:var(--radius-card); font:inherit; font-weight:600; }
    .btn-cancel { background:transparent; border:1px solid var(--border); color:var(--fg); }
    .btn-confirm { background:var(--fg); border:1px solid var(--fg); color:var(--bg); }
    /* square corners over seed pills */
    .icon-btn, .pill, .tag, .btn-primary, .btn-secondary, .ph-img { border-radius: var(--radius-card) !important; }

  </style>
</head>

              </section>
              <section id="ex-confirm" data-state="EX.confirm">
                <div class="header" data-region="R3" aria-label="Chrome">
                  <div>
                    <p class="greeting">Local pack</p>
                    <h1>Gallery</h1>
                  </div>
                  <button type="button" class="settings-btn" data-control="C3" disabled>Settings</button>
                </div>
                <section class="progress-block" data-region="R1" aria-label="Pack progress">
                  <p class="label">Completed <span class="num">37</span> / 200</p>
                  <div class="progress-track" role="progressbar" aria-valuenow="37" aria-valuemin="0" aria-valuemax="200"><span></span></div>
                </section>
                <div class="confirm-overlay" role="dialog" aria-labelledby="reset-title">
                  <div class="confirm-sheet">
                    <p id="reset-title">Reset this puzzle? Progress and best time will be cleared.</p>
                    <div class="confirm-actions">
                      <button type="button" class="btn-cancel">Cancel</button>
                      <button type="button" class="btn-confirm">Confirm</button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </article>
        </main>
<div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
