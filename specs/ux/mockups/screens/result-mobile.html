<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Result · mobile · SimpleNono</title>
  <style>
    /* Open Design mobile-app frame + aesthetics remap (PAL.S1) */
    :root {
      --bg: #F4F7F8;
      --fg: #1B2833;
      --muted: #6E7F8C;
      --line: #C5D0D6;
      --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --radius: 0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 15px;
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 420px; }
    .caption {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: stretch;
    }
    .caption strong { color: var(--fg); font-weight: 600; }
    nav[aria-label="States"] { display: flex; gap: 12px; align-self: stretch; font-size: 13px; }
    nav[aria-label="States"] a { color: var(--fg); }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 28px 60px -12px rgba(0,0,0,0.45);
    }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 5;
    }
    .screen {
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
    }
    .content { flex: 1 1 auto; overflow-y: auto; padding: 12px 20px 20px; }
    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: "";
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--fg); border-radius: 999px; opacity: 0.85;
    }
    .states > section { display: none; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    .reveal {
      border: 1px solid var(--line);
      padding: 20px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }
    .morph {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .morph .fills,
    .morph .pixel,
    .morph .picture {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }
    .morph .fills span {
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .morph .fills span.on { background: var(--fg); }
    .morph .pixel, .morph .picture { display: block; }
    .morph .pixel svg, .morph .picture svg { display: block; width: 100%; height: 100%; }
    /* PER.R5 / MOT.E1: fills fade into the stored pixel picture, in place, linear */
    section[data-state="pixel"] .fills { animation: fade-out 300ms linear forwards; }
    section[data-state="pixel"] .pixel { animation: fade-in 300ms linear forwards; }
    /* MOT.E2: the pixel picture fades into the stored generated picture */
    section[data-state="picture"] .fills { opacity: 0; }
    section[data-state="picture"] .pixel { opacity: 1; animation: fade-out 300ms linear forwards; }
    section[data-state="picture"] .picture { opacity: 0; animation: fade-in 300ms linear forwards; }
    /* S1 Default: morph complete */
    section[data-state="default"] .fills,
    section[data-state="default"] .pixel { opacity: 0; }
    section[data-state="default"] .picture { opacity: 1; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      section[data-state="pixel"] .fills,
      section[data-state="picture"] .pixel,
      section[data-state="picture"] .fills { opacity: 0; animation: none; }
      section[data-state="pixel"] .pixel,
      section[data-state="picture"] .pixel { opacity: 1; }
      section[data-state="picture"] .picture,
      section[data-state="default"] .picture { opacity: 1; animation: none; }
    }
    .chrome { margin-bottom: 12px; }
    button.back {
      min-height: 44px;
      width: 100%;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
    button.back:disabled { opacity: 0.35; }
    .chrome + .note { margin-top: 0; }
    .note {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
