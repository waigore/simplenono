<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Result · mobile · SimpleNono</title>
  <style>
    /* Open Design mobile-app frame + aesthetics remap (PAL.S1) */
    :root {
      --bg: #F4F7F8;
      --fg: #1B2833;
      --muted: #6E7F8C;
      --line: #C5D0D6;
      --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --radius: 0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 15px;
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 420px; }
    .caption {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: stretch;
    }
    .caption strong { color: var(--fg); font-weight: 600; }
    nav[aria-label="States"] { display: flex; gap: 12px; align-self: stretch; font-size: 13px; }
    nav[aria-label="States"] a { color: var(--fg); }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 28px 60px -12px rgba(0,0,0,0.45);
    }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 5;
    }
    .screen {
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
    }
    .content { flex: 1 1 auto; overflow-y: auto; padding: 12px 20px 20px; }
    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: "";
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--fg); border-radius: 999px; opacity: 0.85;
    }
    .states > section { display: none; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
    }
    .reveal {
      border: 1px solid var(--line);
      padding: 20px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }
    .morph {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .morph .fills,
    .morph .picture {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }
    .morph .fills span {
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .morph .fills span.on { background: var(--fg); }
    .morph .picture {
      background: linear-gradient(135deg, #2a3a48 0%, #1B2833 40%, #4a6578 100%);
      opacity: 0;
    }
    .morph .picture::after {
      content: "Solution";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F4F7F8;
      opacity: 0.85;
    }
    section[data-state="default"] .morph .fills { opacity: 0; }
    section[data-state="default"] .morph .picture { opacity: 1; }
    section[data-state="morphing"] .morph .fills { animation: fade-fills 0.3s linear forwards; }
    section[data-state="morphing"] .morph .picture { animation: reveal 0.3s linear forwards; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-fills { from { opacity: 1; } to { opacity: 0; } }
    button.back {
      min-height: 44px;
      width: 100%;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
    button.back:disabled { opacity: 0.35; }
    .note {
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="caption"><strong>UI-result</strong> · mobile · Open Design mobile-app · aesthetics remap</p>
    <nav aria-label="States">
      <a href="#state-default">Default (morph done)</a>
      <a href="#state-morphing">Morphing</a>
    </nav>
    <div class="device">
      <div class="island" aria-hidden="true"></div>
      <div class="screen">
        <div class="statusbar" aria-hidden="true"><span>9:41</span><span>●●●</span></div>
        <div class="content">
          <article data-screen="UI-result">
            <div class="states">
              <section id="state-default" data-state="default">
                <h1>Solved</h1>
                <div class="reveal" data-region="R1" aria-label="Reveal">
                  <div class="morph" aria-label="Fill to solution morph complete">
                    <div class="fills" aria-hidden="true">
                      <span class="on"></span><span class="on"></span><span></span><span></span><span></span>
                      <span class="on"></span><span></span><span class="on"></span><span></span><span></span>
                      <span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span>
                      <span></span><span class="on"></span><span></span><span></span><span></span>
                      <span></span><span class="on"></span><span class="on"></span><span></span><span></span>
                    </div>
                    <div class="picture"></div>
                  </div>
                </div>
                <div data-region="R2" aria-label="Chrome">
                  <button type="button" class="back" data-control="C1">Back to gallery</button>
                </div>
              </section>
              <section id="state-morphing" data-state="morphing">
                <h1>Solved</h1>
                <div class="reveal" data-region="R1" aria-label="Reveal">
                  <div class="morph" aria-label="Fill to solution morph playing">
                    <div class="fills" aria-hidden="true">
                      <span class="on"></span><span class="on"></span><span></span><span></span><span></span>
                      <span class="on"></span><span></span><span class="on"></span><span></span><span></span>
                      <span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span>
                      <span></span><span class="on"></span><span></span><span></span><span></span>
                      <span></span><span class="on"></span><span class="on"></span><span></span><span></span>
                    </div>
                    <div class="picture"></div>
                  </div>
                </div>
                <div data-region="R2" aria-label="Chrome">
                  <button type="button" class="back" data-control="C1" disabled>Back to gallery</button>
                </div>
                <p class="note">Two stored pictures: 300 ms fills→pixel, then 300 ms pixel→generated; clues not in morph</p>
              </section>
            </div>
          </article>
        </div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
