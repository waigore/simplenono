<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · mobile · SimpleNono</title>
  <style>
    :root {
      --bg: #F4F7F8;
      --fg: #1B2833;
      --muted: #6E7F8C;
      --line: #C5D0D6;
      --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --radius: 0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 15px;
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
    }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 420px; }
    .caption {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: stretch;
    }
    .caption strong { color: var(--fg); font-weight: 600; }
    nav[aria-label="States"] { align-self: stretch; font-size: 13px; }
    nav[aria-label="States"] a { color: var(--fg); }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow: 0 28px 60px -12px rgba(0,0,0,0.45);
    }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 124px; height: 36px; background: #000; border-radius: 999px; z-index: 5;
    }
    .screen {
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
    }
    .content { flex: 1 1 auto; overflow-y: auto; padding: 12px 20px 20px; }
    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after {
      content: "";
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; background: var(--fg); border-radius: 999px; opacity: 0.85;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
    }
    .options {
      border: 1px solid var(--line);
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row .hint {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    button.toggle {
      min-height: 44px;
      min-width: 64px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      font-family: var(--mono);
    }
    button.toggle[aria-pressed="true"] {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    button.back {
      min-height: 44px;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="caption"><strong>UI-settings</strong> · mobile · Open Design mobile-app · aesthetics remap</p>
    <nav aria-label="States"><a href="#state-default">Default</a></nav>
    <div class="device">
      <div class="island" aria-hidden="true"></div>
      <div class="screen">
        <div class="statusbar" aria-hidden="true"><span>9:41</span><span>●●●</span></div>
        <div class="content">
          <article data-screen="UI-settings">
            <section id="state-default" data-state="default">
              <h1>Settings</h1>
              <div class="options" data-region="R1" aria-label="Options">
                <div class="row">
                  <div>
                    <span>Haptics</span>
                    <span class="hint">Default on</span>
                  </div>
                  <button type="button" class="toggle" data-control="C1" aria-pressed="true">On</button>
                </div>
                <div class="row">
                  <div>
                    <span>Mute music</span>
                    <span class="hint">BGM only · SFX on</span>
                  </div>
                  <button type="button" class="toggle" data-control="C2" aria-pressed="false">Off</button>
                </div>
              </div>
              <div data-region="R2" aria-label="Chrome">
                <button type="button" class="back" data-control="C3">Back</button>
              </div>
            </section>
          </article>
        </div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
