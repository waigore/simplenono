<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle · desktop · SimpleNono</title>
  <style>
    /* Play template + the desktop peers' bound token remap (PAL.S1 / UIS.T1 / UIS.T2). */
    :root {
      --bg: #F4F7F8;
      --fg: #1B2833;
      --muted: #6E7F8C;
      --line: #C5D0D6;
      --major: #B0BBC3;
      --cross: #5C6B78;
      --dim: #6E7F8C;
      --error: #3A6F8F;
      --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --radius: 0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.4 var(--font);
      color: var(--fg);
      background: var(--bg);
    }
    .doc {
      max-width: 96rem;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    .doc > .caption {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .doc > .caption strong { color: var(--fg); }
    nav[aria-label="States"] { display: flex; gap: 0.75rem; margin: 0 0 1rem; font-size: 14px; }
    nav[aria-label="States"] a { color: var(--fg); }
    .states > section { display: none; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    .state-title {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
      margin: 0 0 0.75rem;
    }
    .frames {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 2rem;
    }
    /* Desktop frame: the 1280×800 CSS-pixel window the desktop board lays out in.
       The board keeps its 40 px cap, so the extra space is margin, not board. */
    .device {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .device .caption {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .device .legend {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .frame {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 15px 16px 13px;
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex: 0 0 36px;
    }
    .chrome .start {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chrome .elapsed {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }
    button.leave, button.settings, button.tool {
      min-height: 36px;
      min-width: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button.tool.active {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .tools {
      display: flex;
      gap: 8px;
      flex: 0 0 36px;
    }
    /* The frame is drawn at 1:1 (1280x800). The stage scales the whole frame
       down to fit the page without changing any ratio inside it. */
    .board-stage {
      width: {FRAME_W}px;
      height: {FRAME_H}px;
      transform: scale(var(--frame-scale, 1));
      transform-origin: top left;
    }
    .frames { --frame-scale: 0.72; }
    /* R2: a fixed frame. No scroll, no pan, no zoom.
       All three puzzle sizes are drawn side by side in the same R2, each at the
       desktop cap: the margin left over is unused space (view.md). */
    .board-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      padding: 8px;
    }
    /* One board at a time, as the code shows one puzzle in R2. The switcher
       only picks which size this note describes; it adds no control. */
    .samples {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }
    .samples > .board-sample {
      grid-area: 1 / 1;
      display: none;
    }
    .samples[data-show="10"] > .board-sample[data-size="10"],
    .samples[data-show="15"] > .board-sample[data-size="15"],
    .samples[data-show="20"] > .board-sample[data-size="20"] {
      display: flex;
    }
    .sample-picker {
      position: absolute;
      right: 6px;
      bottom: 2px;
      display: flex;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
    }
    .sample-picker button {
      font: inherit;
      padding: 0 4px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }
    .samples[data-show="10"] ~ .sample-picker [data-pick="10"],
    .samples[data-show="15"] ~ .sample-picker [data-pick="15"],
    .samples[data-show="20"] ~ .sample-picker [data-pick="20"] {
      border-color: var(--fg);
      color: var(--fg);
    }
    .sample-dims {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin: 0 0 2px;
    }
    .viewport-label {
      position: absolute;
      top: 2px;
      left: 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .board-sample {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .board-sample figcaption {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }
    .sample-note {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin: 0;
      text-align: center;
    }
    .board-grid {
      display: grid;
      grid-template-columns: var(--clue-w) repeat(var(--cols), var(--cell));
      grid-template-rows: var(--clue-h) repeat(var(--rows), var(--cell));
      gap: 0;
      width: max-content;
    }
    .corner { background: transparent; }
    .clue {
      display: flex;
      font-family: var(--mono);
      font-size: var(--clue-font);
      color: var(--fg);
      line-height: 1.05;
      overflow: hidden;
    }
    .clue.col {
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 1px;
    }
    .clue.row {
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      padding-right: 3px;
      gap: 3px;
    }
    .clue .run { display: block; }
    .clue .run.dim { color: var(--dim); }
    .clue.error { color: var(--error); font-weight: 600; }
    .clue.empty .run { color: var(--muted); }
    .cell {
      width: var(--cell);
      height: var(--cell);
      border: 1px solid var(--line);
      background: var(--bg);
      padding: 0;
      cursor: pointer;
    }
    /* PAL.C7 Major at every multiple of 5 (SRF.O2). $="c5" also matches c15. */
    .cell[aria-label$="c5"]:not([aria-label$="c15"]),
    .cell[aria-label$="c10"],
    .cell[aria-label$="c15"],
    .cell[aria-label$="c20"] {
      border-right-color: var(--major);
    }
    .cell[aria-label^="r5c"],
    .cell[aria-label^="r10c"],
    .cell[aria-label^="r15c"],
    .cell[aria-label^="r20c"] {
      border-bottom-color: var(--major);
    }
    .cell.fill { background: var(--fg); }
    .cell.cross {
      background: var(--bg);
      background-image:
        linear-gradient(45deg, transparent 42%, var(--cross) 42%, var(--cross) 58%, transparent 58%),
        linear-gradient(-45deg, transparent 42%, var(--cross) 42%, var(--cross) 58%, transparent 58%);
    }
    .ready-beat {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: color-mix(in oklch, var(--bg) 72%, transparent);
      pointer-events: none;
    }
    .ready-beat span {
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 10px 18px;
      background: var(--bg);
    }
    .hint {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
    .measures {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .measures summary { cursor: pointer; }
    .measures table {
      border-collapse: collapse;
      margin-top: 6px;
    }
    .measures th, .measures td {
      border: 1px solid var(--line);
      padding: 2px 8px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

  <script>
    // The three puzzle sizes share one R2 frame: the code draws one board at a
    // time, so the sample note follows the size picked instead of stacking them.
    for (const picker of document.querySelectorAll(".sample-picker")) {
      picker.addEventListener("click", (event) => {
        const button = event.target.closest("[data-pick]");
        if (!button) return;
        picker.closest(".board-wrap").querySelector(".samples").dataset.show = button.dataset.pick;
      });
    }
  </script>
