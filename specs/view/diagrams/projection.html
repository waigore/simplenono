<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projection</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --accent: #0b57d0; --muted: #5c574e; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p { color: var(--muted); margin: 0; }
    figure { margin: 1rem 0; border: 1px solid var(--line); padding: 0.5rem; }
    figcaption { font-size: 0.875rem; color: var(--muted); }
    svg { width: 100%; height: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
    .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
    .safe { fill: none; stroke: var(--accent); stroke-dasharray: 6 4; }
    .aspect { fill: none; stroke: var(--muted); stroke-dasharray: 2 4; }
    .ray { stroke: var(--warn); stroke-width: 1.5; }
    .axis { stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
    .scale { stroke: var(--fg); stroke-width: 3; }
  </style>
</head>
<body>
  <!-- Authoring rules: .agents/specs/rules/view/diagrams.md. Replace every fill-in; draw to scale; keep data-element on each drawn element. -->
  <article data-spec="PRJ">
    <header>
      <p>PRJ</p>
      <h1>Projection</h1>
      <p>Orthographic flat UI (PRJ.P1). Scale: 24 px = 1 cell unit.</p>
    </header>

    <figure>
      <svg viewBox="0 0 640 360" role="img" aria-label="Frame, visible area, aspect range, and safe area">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" />
          </marker>
        </defs>
        <g data-element="PRJ.A1">
          <rect class="aspect" x="40" y="40" width="560" height="280" />
          <text x="44" y="34">PRJ.A1 aspect ~9:16–16:9; bars outside</text>
        </g>
        <g data-element="PRJ.V1">
          <rect class="frame" x="80" y="60" width="480" height="240" />
          <text x="84" y="76">PRJ.V1 full size×size grid (+ clue chrome in framing)</text>
        </g>
        <g data-element="PRJ.A2">
          <rect class="safe" x="104" y="72" width="432" height="216" />
          <text x="108" y="282">PRJ.A2 safe ~90%; clues + grid inside</text>
        </g>
        <g data-element="SPC.A1">
          <line class="axis" x1="320" y1="180" x2="380" y2="180" />
          <line class="axis" x1="320" y1="180" x2="320" y2="240" />
          <text x="384" y="184">+x column</text>
          <text x="324" y="256">+y row down</text>
        </g>
        <g data-element="scale">
          <line class="scale" x1="80" y1="340" x2="104" y2="340" />
          <text x="110" y="344">1 unit (1 cell)</text>
        </g>
      </svg>
      <figcaption>Front view of the frame. Fixed board; no cameras. Axes from SPC.A1.</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 240" role="img" aria-label="Side view of orthographic projection">
        <g data-element="PRJ.P1">
          <line class="ray" x1="80" y1="40" x2="560" y2="40" />
          <line class="ray" x1="80" y1="200" x2="560" y2="200" />
          <line class="frame" x1="200" y1="40" x2="200" y2="200" />
          <text x="72" y="28">PRJ.P1 orthographic; visible height = full open board</text>
          <text x="208" y="120">board plane</text>
        </g>
      </svg>
      <figcaption>Side view with parallel rays. Visibility limits N/A — no draw distance.</figcaption>
    </figure>
  </article>
</body>
</html>
